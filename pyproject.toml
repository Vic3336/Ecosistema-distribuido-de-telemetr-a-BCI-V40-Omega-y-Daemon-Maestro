[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gema-orquestador"
version = "1.0.0"
description = "Ecosistema distribuido de telemetría BCI V40-Omega y Daemon Maestro"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Víctor Manuel Ortega Smith", email = "vmosmith@developer.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "orjson>=3.8.0",
    "lz4>=4.0.0",
    "pyserial>=3.5"
]

[project.scripts]
gema = "gema_orquestador.cli:main"

[tool.setuptools.packages.find]
include = ["gema_orquestador*"]

